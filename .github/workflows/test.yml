name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Init submodules
        run: git submodule update --init packages/@mikrojs/quickjs/deps/quickjs
          packages/@mikrojs/native/deps/nanocbor

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - run: pnpm build:native
      - run: pnpm test:js -- --coverage --coverage.reporter=json-summary
          --coverage.reporter=text
      - run: pnpm test:sim
      # The unpack path parses bytes served by the registry, so it is the one
      # place a hostile build reaches the device before any JS runs.
      - run: pnpm test:ota-unpack

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct + '%';
              const lines = [
                '## Test Coverage',
                '',
                '| Metric | Coverage |',
                '|--------|----------|',
                '| Statements | ' + fmt(c.statements) + ' |',
                '| Branches | ' + fmt(c.branches) + ' |',
                '| Functions | ' + fmt(c.functions) + ' |',
                '| Lines | ' + fmt(c.lines) + ' |',
              ];
              console.log(lines.join('\n'));
            " >> "$GITHUB_STEP_SUMMARY"
          fi
