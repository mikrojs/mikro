name: Build Firmware

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      target:
        description: 'Only the boards for this chip, like esp32c6 (all builds every board)'
        type: string
        default: 'all'

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tagged releases are handled by release.yml, which uses the same firmware-build
# composite action and bundles the binaries into the published mikro
# npm package. This workflow only produces artifacts for ad-hoc / PR / dispatch
# builds. An artifact holds an image folder in a .tar.gz: extract it and flash
# the folder with `mikro flash --build-dir <folder>`.
#
# The boards and their images come from packages/mikro/boards.config.ts
# (`mikro fw list`), one job per image.

permissions:
  contents: read

jobs:
  setup:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'firmware')
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # fw list only reads boards.config.ts: no native builds, no qjsc
      - uses: ./.github/actions/setup-pnpm
        with:
          ignore-scripts: 'true'
      - id: read
        shell: bash
        working-directory: packages/mikro
        env:
          MIKROJS_WORKSPACE: '1'
          TARGET: ${{ inputs.target }}
        run: |
          images=$(node bin/mikrojs.js fw list --json | jq -c --arg chip "${TARGET:-all}" \
            '[.result.boards[] | select($chip == "all" or .chip == $chip) | {board: .name, image: .images[]}]')
          if [ "$images" = '[]' ]; then
            echo "::error::No board in packages/mikro/boards.config.ts is for the chip \"$TARGET\"."
            exit 1
          fi
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.images) }}
    name: build (${{ matrix.board }}, ${{ matrix.image }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false

      - uses: ./.github/actions/firmware-build
        with:
          board: ${{ matrix.board }}
          image: ${{ matrix.image }}
          pack-format: tarball
          # Named like `mikro fw pack` names archives
          artifact-name: mikro-fw-${{ matrix.board }}${{ matrix.image != 'full' && format('+{0}', matrix.image) || '' }}
