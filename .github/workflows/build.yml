name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs

  lib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Init submodules
        run: git submodule update --init packages/@mikrojs/quickjs/deps/quickjs
          packages/@mikrojs/native/deps/nanocbor

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The test build generates check-in wire fixtures from
      # @mikrojs/registry, which it imports from that package's built dist.
      - run: pnpm build:ts

      - run: cmake -B packages/@mikrojs/native/build packages/@mikrojs/native
          -DBUILD_TESTING=ON
      - run: cmake --build packages/@mikrojs/native/build
      - run: ctest --test-dir packages/@mikrojs/native/build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Init submodules
        run: git submodule update --init packages/@mikrojs/quickjs/deps/quickjs
          packages/@mikrojs/native/deps/nanocbor

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The test build generates check-in wire fixtures from
      # @mikrojs/registry, which it imports from that package's built dist.
      - run: pnpm build:ts

      - run: >
          cmake -B packages/@mikrojs/native/build-asan packages/@mikrojs/native
          -DBUILD_TESTING=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -g
          -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -g
          -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build packages/@mikrojs/native/build-asan
      - run: ctest --test-dir packages/@mikrojs/native/build-asan --output-on-failure
        env:
          # detect_stack_use_after_return stays off: its fake stack breaks
          # QuickJS's address-distance stack-depth checks.
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Init submodules
        run: git submodule update --init packages/@mikrojs/quickjs/deps/quickjs
          packages/@mikrojs/native/deps/nanocbor

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The test build generates check-in wire fixtures from
      # @mikrojs/registry, which it imports from that package's built dist.
      - run: pnpm build:ts

      - run: pip install gcovr

      - run: cmake -B packages/@mikrojs/native/build-coverage packages/@mikrojs/native
          -DBUILD_TESTING=ON -DMIKROJS_COVERAGE=ON
      - run: cmake --build packages/@mikrojs/native/build-coverage
      - run: ctest --test-dir packages/@mikrojs/native/build-coverage
          --output-on-failure

      # gcovr.cfg holds the filters and the fail-under-line ratchet
      - run: gcovr build-coverage
        working-directory: packages/@mikrojs/native
