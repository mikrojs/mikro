name: Setup pnpm + Node
description: Install pnpm and Node.js, then run pnpm install
inputs:
  node-version:
    description: Node.js version
    default: '24'
  ignore-scripts:
    description: Pass --ignore-scripts to pnpm install (skips postinstall hooks like
      cmake-js)
    default: 'false'
runs:
  using: composite
  steps:
    # pnpm/setup has no --ignore-scripts input, so that path installs in the
    # step below instead.
    - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        install: ${{ inputs.ignore-scripts != 'true' }}
        require-lockfile: true

    - if: inputs.ignore-scripts == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile --ignore-scripts
