name: Setup pnpm + Node
description: Install pnpm and Node.js, then run pnpm install
inputs:
  node-version:
    description: Node.js version
    default: '24'
  ignore-scripts:
    description: Pass --ignore-scripts to pnpm install (skips postinstall hooks like
      cmake-js)
    default: 'false'
  registry-url:
    description: Optional npm registry URL (sets up auth)
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.ignore-scripts }}
      run: |
        if [ "$IGNORE_SCRIPTS" = "true" ]; then
          pnpm install --frozen-lockfile --ignore-scripts
        else
          pnpm install --frozen-lockfile
        fi
