name: Build firmware
description: Build one image of one of mikro's generic boards and upload it as
  an artifact
# NOTE: Caller must:
#   1. Set `runs-on: ubuntu-latest` and `container: espressif/idf:v6.1`
#      (composite actions cannot set these themselves).
#   2. Run `actions/checkout` before invoking this action so that the
#      relative `uses: ./.github/actions/firmware-build` path resolves.
inputs:
  board:
    description: |
      The board in packages/mikro/boards.config.ts (esp32c6-generic), as
      `mikro fw list --json` names it.
    required: true
  image:
    description: |
      The board's image to build: full, or one of its images (no-ble). Each
      job builds one, so the images build in parallel.
    required: false
    default: full
  pack-format:
    description: 'How to lay out the uploaded artifact: tarball | unpacked'
    required: true
  artifact-name:
    description: Name to upload the artifact under
    required: true
  version:
    description: |
      Optional version to write into all publishable package.json files before
      building. The firmware embeds this via sys.version, so the firmware
      must be built against the same version that gets published. Leave empty
      to build against whatever is currently in package.json (used by the
      ad-hoc firmware.yml workflow).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PACK_FORMAT: ${{ inputs.pack-format }}
      run: |
        case "$PACK_FORMAT" in
          unpacked|tarball) ;;
          *)
            echo "Invalid pack-format: '$PACK_FORMAT' (must be 'unpacked' or 'tarball')"
            exit 1
            ;;
        esac

    - shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init packages/@mikrojs/quickjs/deps/quickjs packages/@mikrojs/native/deps/nanocbor

    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3
      with:
        runtime: node@24
        require-lockfile: true

    # Apply the planned version BEFORE idf.py builds, so sys.version
    # embedded in the firmware matches the version that gets published.
    # `--mode release` is a placeholder; `--set` bypasses the mode-specific
    # compute path entirely.
    - if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: pnpm --silent releaser bump --mode release --set "$VERSION"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ccache
        key: ccache-firmware-${{ inputs.board }}-${{ inputs.image }}-${{ github.sha }}
        restore-keys: |
          ccache-firmware-${{ inputs.board }}-${{ inputs.image }}-
          ccache-firmware-${{ inputs.board }}-

    - shell: bash
      run: |
        which ccache || apt-get update && apt-get install -y ccache
        ccache --zero-stats
        ccache --set-config=max_size=500M
        ccache --set-config=cache_dir=$HOME/.cache/ccache
        # ESP-IDF compiles with -specs=<build>/specs/picolibc.specs, copied at
        # configure time. ccache hashes a specs file by mtime unless told to
        # hash content, so a fresh build dir missed every object.
        ccache --set-config=compiler_check=content

    # One image of the board, from mikro's boards.config.ts: `mikro fw build
    # --image` builds it into .mikro/build-fw-<board> (+<image> for the other
    # images) and writes it to dist-fw/<board>/<image>, firmware.json included
    # (name, chip, version, features). MIKROJS_WORKSPACE runs the CLI from its
    # TypeScript source, as in a checkout, so it needs no build.
    - shell: bash
      working-directory: packages/mikro
      env:
        IDF_CCACHE_ENABLE: '1'
        MIKROJS_WORKSPACE: '1'
        BOARD: ${{ inputs.board }}
        IMAGE: ${{ inputs.image }}
      run: |
        . $IDF_PATH/export.sh
        start=$(date +%s)
        node bin/mikrojs.js fw build --board "$BOARD" --image "$IMAGE"
        ccache --show-stats
        # Drop the entries this build did not use, so the saved cache stays
        # the size of one build instead of growing towards max_size.
        ccache --evict-older-than "$(( $(date +%s) - start + 1 ))s"

    - shell: bash
      working-directory: packages/mikro
      env:
        MIKROJS_WORKSPACE: '1'
        BOARD: ${{ inputs.board }}
        IMAGE: ${{ inputs.image }}
      run: |
        . $IDF_PATH/export.sh
        suffix=$([ "$IMAGE" = full ] || echo "+$IMAGE")
        node bin/mikrojs.js idf -C ".mikro/fw-$BOARD$suffix" -B ".mikro/build-fw-$BOARD$suffix" size

    # The image in a folder of its name, which the release puts in mikro's
    # dist-fw/<board> beside the board's other images.
    - if: inputs.pack-format == 'unpacked'
      shell: bash
      env:
        BOARD: ${{ inputs.board }}
        IMAGE: ${{ inputs.image }}
      run: |
        mkdir -p firmware-out
        cp -R "packages/mikro/dist-fw/$BOARD/$IMAGE" firmware-out/

    - if: inputs.pack-format == 'tarball'
      shell: bash
      working-directory: packages/mikro/dist-fw/${{ inputs.board }}/${{ inputs.image }}
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        mkdir -p "$GITHUB_WORKSPACE/firmware-out"
        tar czf "$GITHUB_WORKSPACE/firmware-out/${ARTIFACT_NAME}.tar.gz" *

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: firmware-out/
        if-no-files-found: error
        retention-days: 7
