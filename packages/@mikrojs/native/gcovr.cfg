# Coverage report for the standalone library. Auto-loaded when gcovr runs
# from this directory: gcovr build-coverage
# Only first-party sources count; QuickJS, nanocbor, and test code are
# outside the filter.
filter = src/
filter = include/
print-summary = yes
# Ratchets: raise as coverage improves, never lower. Floors trail the
# measured numbers (90.1% lines / 65.1% branches on macOS llvm gcov) with
# margin for CI's gcc, whose branch instrumentation in particular counts
# differently.
fail-under-line = 89
fail-under-branch = 63
