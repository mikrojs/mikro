# Coverage report for the standalone library. Auto-loaded when gcovr runs
# from this directory: gcovr build-coverage
# Only first-party sources count; QuickJS, nanocbor, and test code are
# outside the filter.
filter = src/
filter = include/
print-summary = yes
# Ratchets: raise as coverage improves, never lower. CI's gcc numbers are
# authoritative (macOS llvm gcov counts higher, esp. for branches: 65.1%
# vs gcc's 56.5% on the same tree).
fail-under-line = 89
fail-under-branch = 56
