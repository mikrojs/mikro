packages:
  - bench-site
  - dev/*
  - examples/*
  - docs
  - esp32
  - packages/@mikrojs/*
  - packages/@repo/*
  - packages/*
  - scripts

# postinstall is usually not needed because these packages ship
# native binaries via optionalDependencies
allowBuilds:
  '@serialport/bindings-cpp': false
  '@swc/core': false
  esbuild: false
  lefthook: false
  sharp: false
  workerd: false

blockExoticSubdeps: true

catalog:
  '@eslint/js': ^10.0.1
  '@optique/core': ^1.2.5
  '@optique/run': ^1.2.5
  '@vitest/coverage-v8': ^5.0.0
  'env-paths': ^4.0.0
  eslint: ^10.10.0
  eslint-plugin-import: ^2.32.0
  eslint-plugin-package-json: ^1.8.0
  eslint-plugin-react-hooks: ^7.1.1
  eslint-plugin-simple-import-sort: ^14.0.0
  globals: ^17.12.0
  tsx: ^4.23.13
  typescript: ^6.0.3
  typescript-eslint: ^8.69.0
  vite: ^8.2.2
  vitest: ^5.0.0

catalogs:
  node24:
    '@types/node': ^24.12.2

ignoreWorkspaceRootCheck: true

minimumReleaseAge: 1440 # minutes

trustPolicy: no-downgrade

trustPolicyExclude:
  - vite@5.4.21

trustPolicyIgnoreAfter: 1051200
minimumReleaseAgeExclude:
  # Renovate security update: esbuild@0.28.1
  - esbuild@0.28.1
  # Renovate security update: vite@8.0.16
  - vite@8.0.16
  # Renovate security update: tar@7.5.21
  - tar@7.5.21
